name: AWS RSS to Discord (Single Thread) - Fixed Duplicates

on:
  schedule:
    # Execute every 30 minutes to check for new AWS announcements
    - cron: '*/30 * * * *'
  workflow_dispatch: # Enable manual execution for testing

jobs:
  check-rss:
    runs-on: ubuntu-latest
    
    steps:
    # Configure Node.js runtime environment
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Important: Use a token that can push to the repository
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm init -y
        npm install rss-parser node-fetch@2 crypto
        
    - name: Check RSS and send to Discord
      run: |
        cat << 'EOF' > check-rss.js
        /**
         * AWS RSS to Discord Bot - Enhanced with Duplicate Prevention
         * 
         * IMPROVEMENTS FROM ORIGINAL:
         * - Uses content hashing to prevent duplicate messages
         * - Stores sent message hashes in git repository for persistence
         * - Combines time-based filtering with content-based deduplication
         * - Handles RSS feed inconsistencies and stale publication dates
         * - Maintains backward compatibility with existing configuration
         */
        
        const Parser = require('rss-parser');
        const fetch = require('node-fetch');
        const crypto = require('crypto');
        const fs = require('fs').promises;
        const path = require('path');
        
        const parser = new Parser();
        
        // Configuration constants
        const RSS_URL = 'https://aws.amazon.com/about-aws/whats-new/recent/feed/';
        const WEBHOOK_URL = process.env.DISCORD_WEBHOOK_URL;
        const THREAD_ID = process.env.THREAD_ID;
        const SENT_HASHES_FILE = 'sent_messages_hashes.json';
        
        /**
         * ENHANCED DUPLICATE PREVENTION STRATEGY
         * 
         * This implementation uses a two-layer approach:
         * 1. Time-based filtering (extended to 24 hours for safety)
         * 2. Content hash-based deduplication using persistent storage
         * 
         * The content hash is generated from title + link + publication date
         * to ensure uniqueness while handling RSS feed inconsistencies.
         */
        
        function generateContentHash(item) {
          // Create unique identifier combining title, link, and publication date
          const content = `${item.title}|${item.link}|${item.pubDate}`;
          return crypto.createHash('sha256').update(content).digest('hex').substring(0, 16);
        }
        
        async function loadSentHashes() {
          try {
            const data = await fs.readFile(SENT_HASHES_FILE, 'utf8');
            const hashData = JSON.parse(data);
            
            // Clean up old hashes (older than 7 days) to prevent file bloat
            const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const cleanedHashes = {};
            
            for (const [hash, timestamp] of Object.entries(hashData)) {
              if (new Date(timestamp) > oneWeekAgo) {
                cleanedHashes[hash] = timestamp;
              }
            }
            
            console.log(`📚 Loaded ${Object.keys(cleanedHashes).length} hash records from storage`);
            return cleanedHashes;
          } catch (error) {
            console.log('📝 No existing hash file found, starting fresh');
            return {};
          }
        }
        
        async function saveSentHashes(hashes) {
          try {
            const hashContent = JSON.stringify(hashes, null, 2);
            await fs.writeFile(SENT_HASHES_FILE, hashContent);
            console.log(`💾 Saved ${Object.keys(hashes).length} hash records to storage`);
            console.log(`📁 File size: ${hashContent.length} bytes`);
            console.log(`📄 File path: ${SENT_HASHES_FILE}`);
            console.log(`📄 File content written: ${hashContent}`);
            
            // Verify file was created and read it back
            const exists = await fs.access(SENT_HASHES_FILE).then(() => true).catch(() => false);
            console.log(`✅ File exists after save: ${exists}`);
            
            if (exists) {
              const readBack = await fs.readFile(SENT_HASHES_FILE, 'utf8');
              console.log(`🔍 File content read back: ${readBack}`);
            }
          } catch (error) {
            console.error('❌ Failed to save hash file:', error);
            console.error('📍 Error details:', error.message);
          }
        }
        
        async function main() {
          try {
            console.log('🔍 Initiating AWS RSS feed monitoring cycle...');
            const now = new Date(); // Define now at the top level
            console.log(`⏱️ Execution started at: ${now.toISOString()}`);
            
            // Load previously sent message hashes
            const sentHashes = await loadSentHashes();
            const isFirstRun = Object.keys(sentHashes).length === 0;
            
            // Fetch RSS feed
            const feed = await parser.parseURL(RSS_URL);
            console.log(`📰 Successfully retrieved RSS feed containing ${feed.items.length} total items`);
            
            // Different filtering strategy for first run vs subsequent runs
            let newItems = [];
            
            if (isFirstRun) {
              console.log('🚀 FIRST RUN DETECTED: Using 24-hour time filter for safety');
              const cutoffTime = new Date(now.getTime() - 24 * 60 * 60 * 1000); // 24 hours for first run
              
              console.log(`⏰ First run cutoff time: ${cutoffTime.toISOString()}`);
              
              for (const item of feed.items) {
                const itemDate = new Date(item.pubDate);
                const contentHash = generateContentHash(item);
                
                console.log(`📄 Evaluating: "${item.title.substring(0, 60)}..."`);
                console.log(`   📅 Published: ${itemDate.toISOString()}`);
                console.log(`   🔑 Content Hash: ${contentHash}`);
                
                if (itemDate >= cutoffTime) {
                  const ageHours = Math.round((now - itemDate) / (1000 * 60 * 60));
                  console.log(`   ✨ FIRST RUN QUALIFIED! Age: ${ageHours} hours`);
                  newItems.push({ ...item, contentHash });
                } else {
                  const ageHours = Math.round((now - itemDate) / (1000 * 60 * 60));
                  console.log(`   ⏰ FILTERED OUT: Age: ${ageHours} hours (first run protection)`);
                }
              }
            } else {
              console.log('🔄 SUBSEQUENT RUN: Using hash + time safety filter');
              
              // Even in subsequent runs, use time window as safety net to prevent sending very old items
              const safetyWindow = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000); // 7 days safety window
              console.log(`⚠️ Safety time window: ${safetyWindow.toISOString()} (preventing very old items)`);
              
              for (const item of feed.items) {
                const itemDate = new Date(item.pubDate);
                const contentHash = generateContentHash(item);
                
                console.log(`📄 Evaluating: "${item.title.substring(0, 60)}..."`);
                console.log(`   📅 Published: ${itemDate.toISOString()}`);
                console.log(`   🔑 Content Hash: ${contentHash}`);
                
                // Check safety time window first (prevent very old items)
                if (itemDate < safetyWindow) {
                  const ageDays = Math.round((now - itemDate) / (1000 * 60 * 60 * 24));
                  console.log(`   🛡️ SAFETY FILTERED: Age: ${ageDays} days (exceeds 7-day safety window)`);
                  continue;
                }
                
                // Then check hash-based filtering
                if (sentHashes[contentHash]) {
                  console.log(`   🚫 DUPLICATE DETECTED: Already sent on ${sentHashes[contentHash]}`);
                } else {
                  const ageHours = Math.round((now - itemDate) / (1000 * 60 * 60));
                  console.log(`   ✨ NEW ITEM QUALIFIED! Age: ${ageHours} hours (hash not found)`);
                  newItems.push({ ...item, contentHash });
                }
              }
            }
            
            console.log(`🎯 Filtering complete: ${newItems.length} new items qualify for Discord delivery`);
            
            if (newItems.length > 0) {
              // Apply stricter spam protection
              const MAX_ITEMS_PER_EXECUTION = 3;  // Reduced from 5 to 3 for better safety
              const itemsToSend = newItems.slice(0, MAX_ITEMS_PER_EXECUTION);
              
              console.log(`📤 Initiating Discord delivery for ${itemsToSend.length} new items...`);
              
              if (newItems.length > MAX_ITEMS_PER_EXECUTION) {
                console.log(`⚠️ SPAM PROTECTION: Limited to ${MAX_ITEMS_PER_EXECUTION} items (${newItems.length} total qualified)`);
                console.log(`📝 Remaining ${newItems.length - MAX_ITEMS_PER_EXECUTION} items will be processed in next cycles`);
              }
              
              // Send items to Discord and track successful deliveries
              const successfulHashes = {};
              
              for (let i = 0; i < itemsToSend.length; i++) {
                const item = itemsToSend[i];
                console.log(`📨 Processing item ${i + 1}/${itemsToSend.length}: "${item.title.substring(0, 50)}..."`);
                
                const success = await sendToThread(item, i + 1, itemsToSend.length);
                
                if (success) {
                  // Mark as sent only if Discord delivery succeeded
                  successfulHashes[item.contentHash] = now.toISOString();
                  console.log(`✅ Item ${i + 1} delivered and marked as sent`);
                } else {
                  console.log(`❌ Item ${i + 1} failed to deliver, will retry next cycle`);
                }
                
                // Rate limiting
                if (i < itemsToSend.length - 1) {
                  console.log(`⏳ Rate limiting: waiting 2 seconds...`);
                  await new Promise(resolve => setTimeout(resolve, 2000));
                }
              }
              
              // Update hash storage with successful deliveries
              Object.assign(sentHashes, successfulHashes);
              
              // Force save even if no new items (for testing)
              if (Object.keys(successfulHashes).length === 0 && Object.keys(sentHashes).length === 0) {
                console.log('🧪 TESTING MODE: Creating empty hash file for debugging');
                sentHashes['debug_empty_' + Date.now()] = now.toISOString();
              }
              
              await saveSentHashes(sentHashes);
              
              console.log(`✅ Discord delivery completed: ${Object.keys(successfulHashes).length} new items sent`);
              
            } else {
              console.log('📭 No new items found for Discord delivery');
            }
            
            console.log(`🏁 RSS monitoring cycle completed at: ${new Date().toISOString()}`);
            
          } catch (error) {
            console.error('❌ CRITICAL ERROR in main execution:', error);
          }
        }
        
        async function sendToThread(item, index = 1, total = 1) {
          try {
            console.log(`🔧 Constructing Discord embed for item ${index}/${total}...`);
            
            const embed = {
              title: item.title.length > 256 ? 
                item.title.substring(0, 253) + '...' : 
                item.title,
              url: item.link,
              description: item.contentSnippet ? 
                (item.contentSnippet.length > 500 ? 
                  item.contentSnippet.substring(0, 497) + '...' : 
                  item.contentSnippet) : 
                'No description available for this announcement',
              color: 0xFF9900,
              timestamp: item.isoDate || item.pubDate,
              footer: {
                text: `AWS What's New • ${index}/${total}`,
                icon_url: 'https://a0.awsstatic.com/libra-css/images/site/fav/favicon.ico'
              },
              fields: [
                {
                  name: '📅 Published',
                  value: new Date(item.pubDate).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                  }),
                  inline: true
                }
              ]
            };
            
            const threadWebhookUrl = THREAD_ID ? 
              `${WEBHOOK_URL}?thread_id=${THREAD_ID}` : 
              WEBHOOK_URL;
            
            const payload = {
              username: 'AWS Updates',
              avatar_url: 'https://a0.awsstatic.com/libra-css/images/site/fav/favicon.ico',
              embeds: [embed]
            };
            
            const response = await fetch(threadWebhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload)
            });
            
            if (response.ok) {
              console.log(`✅ Successfully delivered to Discord: "${item.title.substring(0, 50)}..."`);
              return true;
            } else {
              const errorText = await response.text();
              console.error(`❌ Discord delivery failed for item ${index}/${total}`);
              console.error(`📍 HTTP Status: ${response.status} ${response.statusText}`);
              console.error(`📍 Error Response: ${errorText}`);
              return false;
            }
            
          } catch (error) {
            console.error(`❌ CRITICAL ERROR during Discord delivery for item ${index}/${total}:`, error);
            return false;
          }
        }
        
        main();
        EOF
        
        node check-rss.js
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        THREAD_ID: ${{ secrets.THREAD_ID || '' }}
        
    # Commit the hash file back to repository for persistence
    - name: Commit hash file
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        echo "🔍 Checking current directory contents:"
        ls -la
        
        # Check if hash file exists and add it
        if [ -f "sent_messages_hashes.json" ]; then
          echo "📁 Hash file found, checking contents..."
          echo "📄 File size: $(wc -c < sent_messages_hashes.json) bytes"
          echo "📄 File contents:"
          cat sent_messages_hashes.json
          echo "--- End of file contents ---"
          
          # Check git status before adding
          echo "📊 Git status before adding file:"
          git status
          
          git add sent_messages_hashes.json
          
          # Check git status after adding
          echo "📊 Git status after adding file:"
          git status
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "📭 No changes to commit (file unchanged)"
            echo "🔍 Checking if file was already committed:"
            git log --oneline -n 5
          else
            echo "💾 File has changes, committing..."
            # Create descriptive commit message with timestamp
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            HASH_COUNT=$(jq length sent_messages_hashes.json 2>/dev/null || echo "unknown")
            
            git commit -m "📊 AWS Bot: Update message hashes (${HASH_COUNT} total) - ${TIMESTAMP} [skip ci]"
            
            # Try to push with error handling
            echo "🚀 Attempting to push to repository..."
            if git push; then
              echo "✅ Successfully pushed hash file to repository"
            else
              echo "❌ Failed to push to repository. Error details:"
              git status
              echo "📝 Repository permissions or branch protection may be preventing push"
            fi
          fi
        else
          echo "📭 No hash file generated"
          echo "🔍 Current directory contents:"
          ls -la
        fi
      continue-on-error: true
